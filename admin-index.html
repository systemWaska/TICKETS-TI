<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Dashboard TI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="adminIndexContent" style="max-width:1100px;margin:0 auto;">
    <div class="metrics-row" id="metricsRow">
      <div class="metric-card pendiente"><div class="metric-label">Pendientes</div><div class="metric-value" id="mPendiente">–</div><span class="metric-icon">🕒</span></div>
      <div class="metric-card proceso"><div class="metric-label">En atención</div><div class="metric-value" id="mProceso">–</div><span class="metric-icon">🛠️</span></div>
      <div class="metric-card alta"><div class="metric-label">Urgentes abiertos</div><div class="metric-value" id="mAlta">–</div><span class="metric-icon">🚨</span></div>
      <div class="metric-card atendido"><div class="metric-label">Atendidos este mes</div><div class="metric-value" id="mAtendido">–</div><span class="metric-icon">✅</span></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">⚡ Acceso rápido</span></div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:.6rem;">
          <a href="admin.html"             class="action-card" style="text-decoration:none;"><div class="action-icon">🔧</div><div><div class="action-title">Panel Admin</div><div class="action-desc">Gestionar y actualizar tickets</div></div></a>
          <a href="todos-los-tickets.html" class="action-card" style="text-decoration:none;"><div class="action-icon">📊</div><div><div class="action-title">Dashboard completo</div><div class="action-desc">Gráficos y análisis por área</div></div></a>
          <a href="historial.html"         class="action-card" style="text-decoration:none;"><div class="action-icon">📜</div><div><div class="action-title">Historial de cambios</div><div class="action-desc">Log de cada actualización realizada</div></div></a>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="panel-title">🕒 Últimos tickets abiertos</span></div>
        <div class="panel-body" style="padding:.5rem;">
          <div id="recentTickets"><p class="muted" style="text-align:center;padding:1rem;">Cargando...</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initLayout('index', 'Dashboard Admin', 'Resumen del sistema', true);
      checkBackendConnection_();

      try {
        const tickets = await window.Utils.jsonpRequest(window.CONFIG.SCRIPT_URL);
        const all = Array.isArray(tickets) ? tickets.map(t => window.Utils.normalizeTicket(t)) : [];
        const now = new Date(), mes = now.getMonth(), anio = now.getFullYear();

        const pendientes = all.filter(t => t.estado === 'Pendiente').length;
        const proceso    = all.filter(t => t.estado === 'En atención' || t.estado === 'Pausado').length;
        const urgentes   = all.filter(t => t.prioridad === 'Alta' && !['Atendido','Anulado'].includes(t.estado)).length;
        const atendidos  = all.filter(t => {
          if (t.estado !== 'Atendido') return false;
          const d = new Date(t.fechaCierre || t.fechaIngreso);
          return d.getMonth() === mes && d.getFullYear() === anio;
        }).length;

        document.getElementById('mPendiente').textContent = pendientes;
        document.getElementById('mProceso').textContent   = proceso;
        document.getElementById('mAlta').textContent      = urgentes;
        document.getElementById('mAtendido').textContent  = atendidos;

        const abiertos = all.filter(t => !['Atendido','Anulado'].includes(t.estado))
          .sort((a,b) => new Date(b.fechaIngreso) - new Date(a.fechaIngreso))
          .slice(0, 8);

        const U = window.Utils;
        document.getElementById('recentTickets').innerHTML = abiertos.length ? abiertos.map(t => `
          <div style="display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-bottom:1px solid #f3f4f6;">
            <span style="font-family:monospace;font-size:.73rem;color:#2563eb;width:65px;flex-shrink:0;">${U.escapeHtml(t.codigo)}</span>
            <span style="flex:1;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${U.escapeHtml(t.titulo||t.nombre)}</span>
            <span class="badge ${U.normalizeClass(t.estado)}">${U.escapeHtml(t.estado)}</span>
          </div>`).join('')
          : '<p class="muted" style="text-align:center;padding:1.5rem;">¡Sin tickets abiertos! 🎉</p>';
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
