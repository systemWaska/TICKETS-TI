<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ticket - Sistema TI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="form-card">
    <h2>➕ Nuevo Ticket</h2>
    <form id="ticketForm" autocomplete="off">
      <div class="form-row-2">
        <div class="form-group">
          <label for="area">Área / Departamento *</label>
          <select id="area" name="area" required onchange="cargarPersonal()">
            <option value="">Seleccione área...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nombre">Personal *</label>
          <select id="nombre" name="nombre" required disabled>
            <option value="">Seleccione primero el área</option>
          </select>
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label for="tipo">Tipo de ticket *</label>
          <select id="tipo" name="tipo" required onchange="actualizarBoton()">
            <option value="">Seleccione...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prioridad">Prioridad *</label>
          <select id="prioridad" name="prioridad" required>
            <option value="">Seleccione...</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="titulo" id="tituloLabel">Título *</label>
        <input type="text" id="titulo" name="titulo" placeholder="Describe brevemente el problema o solicitud" required maxlength="200">
        <p class="help-text">Máx. 200 caracteres</p>
      </div>
      <div class="form-group">
        <label for="descripcion">Descripción detallada *</label>
        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Describe con pasos claros, qué ocurre, cuándo y con qué frecuencia..." required maxlength="2000"></textarea>
        <p class="help-text"><span id="descCount">0</span>/2000 caracteres</p>
      </div>
      <div class="form-msg" id="formMsg"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="btnEnviar">Enviar Ticket</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/registrar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLayout('registrar', 'Registrar Ticket', 'Crea una nueva solicitud');
      checkBackendConnection_();
    });
    // Contador descripción
    document.addEventListener('input', e => {
      if (e.target.id === 'descripcion') {
        document.getElementById('descCount').textContent = e.target.value.length;
      }
    });
  </script>
</body>
</html>
