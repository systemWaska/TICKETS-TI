<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Ticket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>➕ Registrar Nuevo Ticket</h1>
        <p>Llena el formulario para generar un nuevo ticket.</p>
    </header>

    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="mis-tickets.html" class="nav-link">📋 Ver Mis Tickets</a>
        <a href="todos-los-tickets.html" class="nav-link">📈 Dashboard</a>
    </nav>

    <main class="container">
        <div id="mensaje" class="alert hidden" style="display: none; margin-bottom: 20px;"></div>

        <form id="ticketForm" class="form">
            <!-- Estado fijo al crear -->
            <input type="hidden" id="estado" name="estado" value="Pendiente">

            <!--
              Evidencia (imagen):
              Por ahora lo dejamos oculto porque más adelante se subirá una imagen.
              Cuando lo habilites, recuerda que Apps Script NO recibe archivos binarios
              por POST normal; lo correcto será subir a Drive y guardar el enlace.
            -->
            <input type="file" id="evidencia" name="evidencia" accept="image/*" style="display:none;">
            <div class="form-group">
                <label for="tipo">Tipo de Solicitud *</label>
                <select id="tipo" name="tipo" required onchange="actualizarBoton()">
                    <!-- Se llena automáticamente desde la hoja "Config" (vía Apps Script: ?action=config) -->
                    <option value="">Cargando tipos...</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="area">Área / Departamento *</label>
                    <select id="area" name="area" required onchange="cargarPersonal()">
                        <!--
                          Se llena automáticamente desde la hoja "Config" (vía Apps Script: ?action=config)
                          Esto evita mantener listas hardcodeadas en el frontend.
                        -->
                        <option value="">Cargando áreas...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre del Personal *</label>
                    <select id="nombre" name="nombre" required disabled>
                        <option value="">Seleccione primero el área...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <!--
                  El texto del label cambia según el Tipo (Incidencia/Requerimiento/Evento).
                  Esto ayuda a que el usuario entienda qué está registrando.
                -->
                <label id="tituloLabel" for="titulo">Título *</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej: Error al iniciar sesión" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción detallada *</label>
                <textarea id="descripcion" name="descripcion" rows="4" minlength="10" required placeholder="Describa el problema o solicitud con detalle..."></textarea>
            </div>

            <div class="form-group">
                <label for="prioridad">Prioridad *</label>
                <select id="prioridad" name="prioridad" required>
                    <!--
                      Se llena automáticamente desde la hoja "Config" (vía Apps Script: ?action=config)
                      Nota: NO dejamos prioridad preseleccionada.
                    -->
                    <option value="">Cargando prioridades...</option>
                </select>
            </div>

            <button type="submit" id="btnEnviar" class="btn-primary" style="width: 100%;">Enviar Requerimiento</button>
        </form>
    </main>

    <footer class="footer">
        <p>© 2025 Sistema de Tickets TI. Todos los derechos reservados.</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/config.js"></script>
<script src="js/registrar.js"></script>
<script src="js/utils.js"></script>
</body>
</html>
