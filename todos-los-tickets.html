<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Tickets</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <h1>📈 Dashboard de Tickets</h1>
        <p>Análisis visual de todos los tickets por área y tipo.</p>
    </header>

    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="registrar.html" class="nav-link">➕ Registrar Nuevo</a>
        <a href="mis-tickets.html" class="nav-link">📋 Mis Tickets</a>
    </nav>

    <main class="container">
        <!-- Gráficos en cards (responsive) -->
        <div class="chart-container">
            <h3>Tickets por Área</h3>
            <canvas id="chartArea"></canvas>
        </div>

        <div class="chart-container">
            <h3>Tickets por Tipo</h3>
            <canvas id="chartType"></canvas>
        </div>

        <div class="table-container">
            <h3>Resumen de Tickets</h3>

            <!-- Desktop: tabla / Mobile: cards -->
            <div class="table-wrap desktop-only">
                <table class="tickets-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Área</th>
                        <th>Tipo</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                    <!-- Datos se cargarán aquí -->
                </tbody>
                </table>
            </div>

            <!-- Mobile: cards -->
            <div class="tickets-cards mobile-only" id="ticketsCards">
                <p class="muted">Cargando...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Sistema de Tickets TI. Todos los derechos reservados.</p>
    </footer>

    <script src="js/config.js"></script> 
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
