<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>📋 Mis Tickets</h1>
        <p>Consulta el estado de tus solicitudes registradas.</p>
    </header>

    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="registrar.html" class="nav-link">➕ Registrar Nuevo</a>
        <a href="todos-los-tickets.html" class="nav-link">📈 Dashboard</a>
    </nav>

    <main class="container">
        <!-- Filtros -->
        <div class="filters-grid">
            <div class="form-group">
                <label for="filterArea">Área / Departamento (opcional)</label>
                <select id="filterArea" disabled>
                    <option value="">Cargando áreas...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterUser">Nombre del Personal (opcional)</label>
                <select id="filterUser" disabled>
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterEstado">Estado (opcional)</label>
                <select id="filterEstado">
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterCode">Código (opcional)</label>
                <input type="text" id="filterCode" placeholder="Ej: INC-001">
            </div>

            <div class="form-group filters-actions">
                <button id="btnBuscar" class="btn-secondary" type="button">Buscar</button>
                <button id="btnLimpiar" class="btn-secondary" type="button">Limpiar</button>
            </div>
        </div>

        <!-- Contenedor de tickets -->
        <div id="ticketsList" class="tickets-container">
            <p class="empty-state">Cargando tickets...</p>
        </div>
    </main>

    <!-- Modal: detalle del ticket -->
    <div id="ticketModal" class="modal">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 id="modalTitle">Detalle del ticket</h3>
                <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button>
            </div>
            <div id="modalBody" class="modal-content"></div>
            <div class="modal-footer">
                <a id="modalOpenTab" class="btn btn-secondary" target="_blank" rel="noopener">Abrir en nueva pestaña</a>
                <button class="btn btn-primary" type="button" id="modalOk">Cerrar</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025 Sistema de Tickets TI. Todos los derechos reservados.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/mis-tickets.js"></script>
</body>
</html>
