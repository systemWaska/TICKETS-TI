<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tickets – Sistema TI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Filtros -->
  <div class="filters-bar">
    <div class="form-group">
      <label for="fArea">Área</label>
      <select id="fArea"><option value="">Todas</option></select>
    </div>
    <div class="form-group">
      <label for="fNombre">Personal</label>
      <select id="fNombre"><option value="">Todos</option></select>
    </div>
    <div class="form-group">
      <label for="fEstado">Estado</label>
      <select id="fEstado"><option value="">Todos</option></select>
    </div>
    <div class="form-group">
      <label for="fTipo">Tipo</label>
      <select id="fTipo"><option value="">Todos</option></select>
    </div>
    <div class="form-group">
      <label for="fCode">Buscar</label>
      <input type="text" id="fCode" placeholder="Código o título...">
    </div>
    <div class="form-group" style="min-width:110px;">
      <label for="fLimit">Mostrar</label>
      <select id="fLimit">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="0">Todos</option>
      </select>
    </div>
    <div class="filter-actions">
      <button id="btnBuscar"  class="btn btn-primary btn-sm">🔍 Buscar</button>
      <button id="btnLimpiar" class="btn btn-secondary btn-sm">✖ Limpiar</button>
      <button id="btnExport"  class="btn btn-secondary btn-sm">⬇ CSV</button>
    </div>
  </div>

  <p class="muted" id="filterInfo" style="margin-bottom:.75rem;"></p>
  <div id="ticketsList"><p class="muted" style="text-align:center;padding:2rem;">Cargando...</p></div>

  <!-- Modal detalle -->
  <div id="ticketModal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Detalle del ticket</h3>
        <button class="modal-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <div id="modalBody" class="modal-content"></div>
      <div class="modal-footer">
        <a id="modalOpenTab" class="btn btn-secondary btn-sm" target="_blank" rel="noopener noreferrer">
          🔗 Ver en página completa
        </a>
        <button class="btn btn-primary btn-sm modal-close-btn" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mis-tickets.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLayout('mis-tickets', 'Mis Tickets', 'Consulta el estado de tus solicitudes');
      checkBackendConnection_();
    });
  </script>
</body>
</html>
