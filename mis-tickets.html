<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>📋 Mis Tickets</h1>
        <p>Consulta el estado de tus solicitudes registradas.</p>
    </header>

    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="registrar.html" class="nav-link">➕ Registrar Nuevo</a>
        <a href="todos-los-tickets.html" class="nav-link">📈 Dashboard</a>
    </nav>

    <main class="container">
        <!--
          Filtros principales.
          - Área y Usuario se cargan desde la hoja Config (Apps Script) para evitar hardcode.
          - Búsqueda por código es opcional.
        -->
        <div class="filters-grid">
            <div class="form-group">
                <label for="filterArea">Área / Departamento *</label>
                <select id="filterArea" required>
                    <option value="">Cargando áreas...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterUser">Nombre del Personal (opcional)</label>
                <select id="filterUser" disabled>
                    <option value="">Todos (del área)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterEstado">Estado (opcional)</label>
                <select id="filterEstado">
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="filterCode">Código (opcional)</label>
                <input type="text" id="filterCode" placeholder="Ej: INC-001">
            </div>

            <div class="form-group filters-actions">
                <button id="btnBuscar" class="btn-secondary" type="button">Buscar</button>
                <button id="btnLimpiar" class="btn-secondary" type="button">Limpiar</button>
            </div>
        </div>

        <div id="ticketsList" class="tickets-container">
            <!-- Los tickets se cargarán aquí dinámicamente -->
            <p class="empty-state">Selecciona tu área para ver los tickets (puedes filtrar por personal/estado/código).</p>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Sistema de Tickets TI. Todos los derechos reservados.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/mis-tickets.js"></script>
</body>
</html>
