<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin – Tickets TI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: min(420px, 92vw); }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-logo { width: 60px; height: 60px; background: #2563eb; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; box-shadow: 0 8px 24px rgba(37,99,235,.4); }
    .login-title { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: .3rem; }
    .login-sub { font-size: .83rem; color: #9ca3af; }
    .login-card { background: #fff; border-radius: 20px; padding: 2.25rem 2rem; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .login-card h2 { font-size: 1rem; font-weight: 700; color: #111827; margin-bottom: 1.5rem; display: flex; align-items: center; gap: .5rem; }
    .pin-input-wrap { position: relative; margin-bottom: 1rem; }
    .pin-big { width: 100%; padding: 1rem; font-size: 1.8rem; letter-spacing: .6em; text-align: center; font-family: monospace; border: 2px solid #e5e7eb; border-radius: 12px; background: #f9fafb; transition: all .2s; }
    .pin-big:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.12); background: #fff; }
    .show-pin { position: absolute; right: .8rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 1.1rem; padding: .2rem; }
    .login-error { display: none; background: #fee2e2; color: #991b1b; border-radius: 8px; padding: .65rem 1rem; font-size: .83rem; font-weight: 500; margin-bottom: .75rem; }
    .login-error.show { display: block; }
    .login-footer { text-align: center; margin-top: 1.5rem; }
    .login-footer a { font-size: .78rem; color: #9ca3af; text-decoration: none; }
    .login-footer a:hover { color: #6b7280; }
    .attempts { font-size: .73rem; color: #9ca3af; text-align: center; margin-top: .5rem; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }
    .shake { animation: shake .4s ease; }
    .btn-login { width: 100%; padding: .85rem; font-size: 1rem; font-weight: 700; background: #2563eb; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: all .2s; }
    .btn-login:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">🔧</div>
      <div class="login-title">Panel Administrativo</div>
      <div class="login-sub">Sistema de Tickets TI</div>
    </div>

    <div class="login-card">
      <h2>🔐 Acceso restringido</h2>

      <div class="form-group">
        <label for="pinLogin" style="font-size:.82rem;font-weight:600;color:#374151;display:block;margin-bottom:.4rem;">
          PIN de administrador
        </label>
        <div class="pin-input-wrap">
          <input type="password" id="pinLogin" maxlength="20"
            placeholder="••••••" class="pin-big" autocomplete="current-password">
          <button type="button" class="show-pin" id="togglePin" title="Mostrar/ocultar PIN">👁</button>
        </div>
      </div>

      <div class="login-error" id="loginError">
        ❌ PIN incorrecto. Verifica e intenta nuevamente.
      </div>

      <button class="btn-login" id="btnLogin" type="button">
        Ingresar al Panel →
      </button>

      <p class="attempts" id="attemptsMsg"></p>
    </div>

    <div class="login-footer">
      <a href="index.html">← Volver al portal de usuarios</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    let attempts = 0;
    const MAX_ATTEMPTS = 5;
    const BLOCK_MS = 5 * 60 * 1000; // 5 minutos
    const BLOCK_KEY = 'admin_blocked_until';

    const pinInput   = document.getElementById('pinLogin');
    const btnLogin   = document.getElementById('btnLogin');
    const errorEl    = document.getElementById('loginError');
    const attemptsEl = document.getElementById('attemptsMsg');
    const toggleBtn  = document.getElementById('togglePin');

    // Ver si está bloqueado
    function checkBlocked() {
      const blockedUntil = parseInt(localStorage.getItem(BLOCK_KEY) || '0');
      if (Date.now() < blockedUntil) {
        const remaining = Math.ceil((blockedUntil - Date.now()) / 60000);
        btnLogin.disabled = true;
        pinInput.disabled = true;
        errorEl.textContent = `⛔ Demasiados intentos fallidos. Espera ${remaining} minuto${remaining > 1 ? 's' : ''} para intentar nuevamente.`;
        errorEl.classList.add('show');
        setTimeout(()=>{ btnLogin.disabled=false; pinInput.disabled=false; errorEl.classList.remove('show'); errorEl.textContent='❌ PIN incorrecto.'; localStorage.removeItem(BLOCK_KEY); attempts=0; }, blockedUntil - Date.now());
        return true;
      }
      return false;
    }

    function tryLogin() {
      if (checkBlocked()) return;
      const entered = pinInput.value.trim();
      const correct = String(window.CONFIG?.ADMIN_PIN || '1234');
      if (entered === correct) {
        // Guardar sesión temporal (30 minutos)
        sessionStorage.setItem('admin_auth', Date.now() + 30*60*1000);
        localStorage.removeItem(BLOCK_KEY);
        btnLogin.textContent = '✅ Accediendo...';
        setTimeout(() => { window.location.href = 'admin.html'; }, 400);
      } else {
        attempts++;
        pinInput.classList.add('shake');
        setTimeout(() => pinInput.classList.remove('shake'), 400);
        pinInput.value = '';
        errorEl.classList.add('show');
        if (attempts >= MAX_ATTEMPTS) {
          localStorage.setItem(BLOCK_KEY, Date.now() + BLOCK_MS);
          checkBlocked();
          attemptsEl.textContent = '';
        } else {
          const rem = MAX_ATTEMPTS - attempts;
          attemptsEl.textContent = `${rem} intento${rem > 1?'s':''} restante${rem > 1?'s':''}`;
        }
        setTimeout(() => pinInput.focus(), 100);
      }
    }

    // Toggle mostrar PIN
    toggleBtn?.addEventListener('click', () => {
      pinInput.type = pinInput.type === 'password' ? 'text' : 'password';
      toggleBtn.textContent = pinInput.type === 'password' ? '👁' : '🙈';
    });

    btnLogin.addEventListener('click', tryLogin);
    pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
    checkBlocked();
    pinInput.focus();
  </script>
</body>
</html>
