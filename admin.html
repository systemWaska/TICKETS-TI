<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Admin - Sistema de Tickets TI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>🔧 Panel de Admin</h1>
        <p>Cambiar estado y registrar solución (solo TI).</p>
    </header>

    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="registrar.html" class="nav-link">➕ Registrar Nuevo</a>
        <a href="todos-los-tickets.html" class="nav-link">📈 Dashboard</a>
        <a href="mis-tickets.html" class="nav-link">📋 Mis Tickets</a>
    </nav>

    <main class="container">
        <div class="admin-panel">
            <h2>Actualizar ticket</h2>
            
            <form id="adminForm" class="form">
                <div class="form-group">
                    <label for="codigo">Código *</label>
                    <input type="text" id="codigo" placeholder="Ej: INC-001" required>
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" required>
                        <option value="">Seleccione estado...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fechaCierre">Fecha de cierre (opcional)</label>
                    <input type="datetime-local" id="fechaCierre">
                </div>
                
                <div class="form-group">
                    <label for="solucion">Solución (resumen) *</label>
                    <input type="text" id="solucion" placeholder="Ej: Se cambió cable / se reinició router">
                </div>
                
                <div class="form-group">
                    <label for="detalle">Detalle de la solución</label>
                    <textarea id="detalle" rows="4" placeholder="Escribe pasos, pruebas, responsables, etc."></textarea>
                </div>
                
                <div id="msg" class="form-msg"></div>
                
                <div class="form-group" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-primary">Actualizar</button>
                    <button type="button" id="btnClear" class="btn-secondary">Limpiar</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Sistema de Tickets TI. Todos los derechos reservados.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
