<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos – Sistema TI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stat-row" id="statRow"></div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">💻 Inventario de equipos</span>
      <button id="btnNuevo" class="btn btn-primary btn-sm">➕ Nuevo equipo</button>
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <div class="grow"><input type="text" id="buscar" placeholder="🔎 Buscar por código, marca, modelo, serie o responsable..."></div>
        <select id="filtroTipo" class="filter-select"><option value="">Todos los tipos</option></select>
        <select id="filtroEstado" class="filter-select"><option value="">Todos los estados</option></select>
      </div>
      <div id="equiposList"><p class="muted" style="text-align:center;padding:2rem;">Cargando inventario...</p></div>
    </div>
  </div>

  <!-- Modal alta/edición -->
  <div id="eqModal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo equipo</h3>
        <button class="modal-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <form id="eqForm" class="modal-content" autocomplete="off">
        <input type="hidden" id="eId">
        <div class="form-group">
          <label for="eTipo">Tipo de equipo *</label>
          <select id="eTipo" required></select>
        </div>
        <div class="form-row" style="display:flex;gap:.6rem;">
          <div class="form-group" style="flex:1;"><label for="eMarca">Marca</label><input type="text" id="eMarca" placeholder="Dell, HP, Lenovo..."></div>
          <div class="form-group" style="flex:1;"><label for="eModelo">Modelo</label><input type="text" id="eModelo" placeholder="OptiPlex 7090"></div>
        </div>
        <div class="form-group">
          <label for="eSerie">N° de serie</label>
          <input type="text" id="eSerie" placeholder="Número de serie / activo">
        </div>
        <div class="form-group">
          <label for="eAsignado">Asignado a (responsable)</label>
          <input type="text" id="eAsignado" list="usuariosDL" placeholder="Nombre del usuario responsable">
          <datalist id="usuariosDL"></datalist>
        </div>
        <div class="form-row" style="display:flex;gap:.6rem;">
          <div class="form-group" style="flex:1;"><label for="eArea">Área</label><input type="text" id="eArea" placeholder="TI, Ventas..."></div>
          <div class="form-group" style="flex:1;"><label for="eUbicacion">Ubicación</label><input type="text" id="eUbicacion" placeholder="Piso 2, Oficina 5"></div>
        </div>
        <div class="form-group">
          <label for="eEstado">Estado *</label>
          <select id="eEstado" required></select>
        </div>
        <div class="form-group">
          <label for="eObs">Observaciones</label>
          <textarea id="eObs" rows="2" placeholder="Detalles, mantenimientos, fallas conocidas..."></textarea>
        </div>
        <div class="form-msg" id="modalMsg"></div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm modal-close-btn" type="button">Cancelar</button>
        <button class="btn btn-primary btn-sm" type="submit" form="eqForm" id="btnGuardar">💾 Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/demo-backend.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/equipos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.Session.require(['Técnico TI', 'Líder de equipo'])) return;
      initLayout('equipos', 'Equipos', 'Inventario de equipos informáticos', true);
      checkBackendConnection_();
      if (typeof initEquipos_ === 'function') initEquipos_();
    });
  </script>
</body>
</html>
