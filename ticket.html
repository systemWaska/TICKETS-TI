<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Ticket - Sistema TI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="ticketDetailWrap" style="max-width:700px;margin:0 auto;">
    <p class="muted" style="text-align:center;padding:3rem;">Cargando ticket...</p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ticket.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      initLayout('mis-tickets', `Ticket ${id}`, 'Detalle completo');
      checkBackendConnection_();
    });
  </script>
</body>
</html>
