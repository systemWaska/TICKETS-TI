<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celulares – Sistema TI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="invRoot"></div>

  <script src="js/config.js"></script>
  <script src="js/demo-backend.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/inventory-module.js"></script>
  <script src="js/celulares.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.Session.require(['Técnico TI', 'Líder de equipo'])) return;
      initLayout('celulares', 'Celulares', 'Registro de celulares y líneas móviles', true);
      checkBackendConnection_();
      if (typeof initCelulares_ === 'function') initCelulares_('#invRoot');
    });
  </script>
</body>
</html>
